<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Nguyễn Đức Mạnh — AI Engineer · Agentic AI · Computer Vision">
  <style>
    .particle { fill: #d8f3ff; animation: pulse 3.2s ease-in-out infinite both; }
    .orb-a { animation: drift-a 15s ease-in-out infinite alternate; }
    .orb-b { animation: drift-b 18s ease-in-out infinite alternate; }
    .name { font: 800 70px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; letter-spacing: .5px; stroke-width: 1.3; stroke-dasharray: 1100;
             animation: draw 2.5s ease-out both, fill-in 1s ease 1.4s both; }
    .rule { transform-box: fill-box; transform-origin: center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) 1.9s both; }
    .role { font: 500 21px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; letter-spacing: 1.4px; fill: #a8c2d1; animation: rise 1s ease 2.2s both; }
    .dot { fill: #73e2a7; }
    @keyframes pulse { 0%, 100% { opacity: .12 } 50% { opacity: .9 } }
    @keyframes drift-a { from { transform: translate(-70px, -5px) } to { transform: translate(130px, 20px) } }
    @keyframes drift-b { from { transform: translate(90px, 15px) } to { transform: translate(-120px, -20px) } }
    @keyframes draw { from { stroke-dashoffset: 1100 } to { stroke-dashoffset: 0 } }
    @keyframes fill-in { from { fill-opacity: 0 } to { fill-opacity: 1 } }
    @keyframes grow { from { transform: scaleX(0); opacity: 0 } to { transform: scaleX(1); opacity: 1 } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b1b2b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#5cc8ff"/><stop offset=".35" stop-color="#8be9fd"/>
      <stop offset=".7" stop-color="#73e2a7"/><stop offset="1" stop-color="#5cc8ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0"/><stop offset=".5" stop-color="#73e2a7"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <ellipse class="orb-a" cx="280" cy="90" rx="270" ry="90" fill="#5cc8ff" opacity=".2" filter="url(#blur)"/>
    <ellipse class="orb-b" cx="750" cy="205" rx="285" ry="82" fill="#73e2a7" opacity=".15" filter="url(#blur)"/>
    <circle class="particle" cx="153" cy="248" r="0.7" style="animation-duration:3.6s;animation-delay:1.8s"/><circle class="particle" cx="77" cy="211" r="0.7" style="animation-duration:4.0s;animation-delay:0.0s"/><circle class="particle" cx="387" cy="104" r="1.8" style="animation-duration:4.1s;animation-delay:0.5s"/><circle class="particle" cx="232" cy="268" r="0.7" style="animation-duration:3.6s;animation-delay:2.0s"/><circle class="particle" cx="31" cy="22" r="1.1" style="animation-duration:4.4s;animation-delay:1.2s"/><circle class="particle" cx="12" cy="263" r="0.9" style="animation-duration:3.2s;animation-delay:1.7s"/><circle class="particle" cx="338" cy="93" r="1.1" style="animation-duration:3.7s;animation-delay:0.9s"/><circle class="particle" cx="739" cy="12" r="1.4" style="animation-duration:4.7s;animation-delay:2.7s"/><circle class="particle" cx="717" cy="138" r="1.4" style="animation-duration:3.8s;animation-delay:0.1s"/><circle class="particle" cx="154" cy="124" r="1.1" style="animation-duration:5.2s;animation-delay:3.1s"/><circle class="particle" cx="587" cy="31" r="1.4" style="animation-duration:4.8s;animation-delay:3.4s"/><circle class="particle" cx="712" cy="58" r="0.9" style="animation-duration:3.0s;animation-delay:0.1s"/><circle class="particle" cx="313" cy="263" r="0.9" style="animation-duration:3.7s;animation-delay:0.6s"/><circle class="particle" cx="277" cy="57" r="1.4" style="animation-duration:3.1s;animation-delay:1.7s"/><circle class="particle" cx="785" cy="140" r="1.4" style="animation-duration:2.5s;animation-delay:2.8s"/><circle class="particle" cx="327" cy="38" r="0.7" style="animation-duration:3.6s;animation-delay:1.5s"/><circle class="particle" cx="774" cy="156" r="1.4" style="animation-duration:3.2s;animation-delay:3.0s"/><circle class="particle" cx="343" cy="92" r="0.7" style="animation-duration:2.9s;animation-delay:3.2s"/><circle class="particle" cx="524" cy="140" r="1.8" style="animation-duration:4.7s;animation-delay:4.0s"/><circle class="particle" cx="605" cy="32" r="0.7" style="animation-duration:4.3s;animation-delay:0.7s"/><circle class="particle" cx="743" cy="266" r="0.7" style="animation-duration:4.7s;animation-delay:0.3s"/><circle class="particle" cx="918" cy="182" r="1.8" style="animation-duration:5.2s;animation-delay:0.4s"/><circle class="particle" cx="728" cy="36" r="1.1" style="animation-duration:4.7s;animation-delay:2.4s"/><circle class="particle" cx="845" cy="51" r="0.7" style="animation-duration:2.6s;animation-delay:0.8s"/><circle class="particle" cx="431" cy="53" r="0.9" style="animation-duration:4.6s;animation-delay:0.4s"/><circle class="particle" cx="256" cy="233" r="0.7" style="animation-duration:3.0s;animation-delay:0.3s"/><circle class="particle" cx="149" cy="86" r="0.9" style="animation-duration:3.2s;animation-delay:3.2s"/><circle class="particle" cx="210" cy="223" r="0.7" style="animation-duration:4.6s;animation-delay:4.0s"/><circle class="particle" cx="417" cy="69" r="1.8" style="animation-duration:2.8s;animation-delay:1.2s"/><circle class="particle" cx="569" cy="37" r="0.9" style="animation-duration:3.7s;animation-delay:1.4s"/><circle class="particle" cx="266" cy="145" r="1.8" style="animation-duration:3.3s;animation-delay:0.3s"/><circle class="particle" cx="984" cy="249" r="0.9" style="animation-duration:4.6s;animation-delay:0.6s"/><circle class="particle" cx="322" cy="12" r="1.8" style="animation-duration:4.6s;animation-delay:3.4s"/><circle class="particle" cx="218" cy="193" r="0.7" style="animation-duration:2.6s;animation-delay:1.1s"/><circle class="particle" cx="386" cy="250" r="1.4" style="animation-duration:3.7s;animation-delay:0.1s"/><circle class="particle" cx="593" cy="13" r="1.8" style="animation-duration:2.7s;animation-delay:1.9s"/><circle class="particle" cx="248" cy="79" r="0.7" style="animation-duration:4.1s;animation-delay:1.8s"/><circle class="particle" cx="595" cy="96" r="0.7" style="animation-duration:5.2s;animation-delay:3.5s"/><circle class="particle" cx="794" cy="22" r="0.9" style="animation-duration:3.3s;animation-delay:3.8s"/><circle class="particle" cx="814" cy="66" r="0.9" style="animation-duration:4.5s;animation-delay:3.8s"/><circle class="particle" cx="298" cy="23" r="1.4" style="animation-duration:2.9s;animation-delay:0.8s"/><circle class="particle" cx="478" cy="254" r="0.7" style="animation-duration:4.1s;animation-delay:1.1s"/><circle class="particle" cx="866" cy="83" r="1.8" style="animation-duration:3.0s;animation-delay:3.8s"/><circle class="particle" cx="706" cy="236" r="0.7" style="animation-duration:3.0s;animation-delay:3.8s"/><circle class="particle" cx="29" cy="125" r="1.8" style="animation-duration:4.9s;animation-delay:1.2s"/><circle class="particle" cx="202" cy="105" r="0.7" style="animation-duration:3.5s;animation-delay:3.2s"/><circle class="particle" cx="244" cy="52" r="0.9" style="animation-duration:5.0s;animation-delay:2.4s"/><circle class="particle" cx="132" cy="103" r="1.1" style="animation-duration:3.8s;animation-delay:2.5s"/>
  </g>
  <rect x=".5" y=".5" width="999" height="279" rx="18" fill="none" stroke="#17354a"/>
  <text class="name" x="500" y="140" text-anchor="middle" fill="url(#shine)" stroke="url(#shine)" filter="url(#glow)">Nguyễn Đức Mạnh</text>
  <rect class="rule" x="355" y="162" width="290" height="2" rx="1" fill="url(#rule)"/>
  <text class="role" x="500" y="204" text-anchor="middle">AI Engineer <tspan class="dot">·</tspan> Agentic AI <tspan class="dot">·</tspan> Computer Vision</text>
</svg>
